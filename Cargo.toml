[package]
name = "fastnotes"
version = "0.2.0"
edition = "2024"
description = "Notas rápidas: Rust puro, Wayland direto, renderização por software"

[dependencies]
calloop = "0.14"
cosmic-text = "0.19"
fontdb = "0.23"
image-webp = "0.2"
libc = "0.2"
png = "0.18"
smithay-client-toolkit = { version = "0.21", features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
xkbcommon = "0.8"
zune-jpeg = "0.4"

# Binário pequeno e rápido de iniciar.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
